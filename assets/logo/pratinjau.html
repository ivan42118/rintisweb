<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File logo RintisWeb</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f5f7; color: #111; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 18px 48px; display: grid; gap: 16px; }
  h1 { margin: 0; font-size: 22px; }
  h2 { margin: 0 0 12px; font-size: 15px; }
  section { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  figure { margin: 0; border-radius: 10px; padding: 14px; display: grid; gap: 8px; justify-items: center; border: 1px solid #eceef2; }
  figure.gelap { background: #071442; border-color: #071442; color: #cfd8f0; }
  figure img { max-width: 100%; height: 90px; object-fit: contain; }
  figure.lebar { grid-column: 1 / -1; }
  figure.lebar img { height: 110px; }
  figcaption { font-size: 12px; color: #666; text-align: center; word-break: break-all; }
  figure.gelap figcaption { color: #a9b6d6; }
  .kecil { display: flex; gap: 18px; align-items: end; flex-wrap: wrap; }
  .kecil figure { border: 0; padding: 0; }
  .wa img { width: 120px; height: 120px; border-radius: 50%; border: 1px solid #e5e7eb; }
</style>
</head>
<body>
<div class="wrap">
  <h1>File logo RintisWeb</h1>

  <section>
    <h2>Logo mendatar (SVG)</h2>
    <div class="grid">
      <figure class="lebar"><img src="rintisweb-logo-warna.svg" alt=""><figcaption>rintisweb-logo-warna.svg</figcaption></figure>
      <figure class="lebar gelap"><img src="rintisweb-logo-putih.svg" alt=""><figcaption>rintisweb-logo-putih.svg</figcaption></figure>
      <figure class="lebar"><img src="rintisweb-logo-tagline-warna.svg" alt=""><figcaption>rintisweb-logo-tagline-warna.svg</figcaption></figure>
      <figure class="lebar gelap"><img src="rintisweb-logo-tagline-putih.svg" alt=""><figcaption>rintisweb-logo-tagline-putih.svg</figcaption></figure>
      <figure><img src="rintisweb-logo-datar.svg" alt=""><figcaption>rintisweb-logo-datar.svg</figcaption></figure>
      <figure><img src="rintisweb-logo-hitam.svg" alt=""><figcaption>rintisweb-logo-hitam.svg</figcaption></figure>
    </div>
  </section>

  <section>
    <h2>Ikon (SVG)</h2>
    <div class="grid">
      <figure><img src="rintisweb-ikon-warna.svg" alt=""><figcaption>rintisweb-ikon-warna.svg</figcaption></figure>
      <figure class="gelap"><img src="rintisweb-ikon-putih.svg" alt=""><figcaption>rintisweb-ikon-putih.svg</figcaption></figure>
      <figure><img src="rintisweb-ikon-datar.svg" alt=""><figcaption>rintisweb-ikon-datar.svg</figcaption></figure>
      <figure><img src="rintisweb-ikon-hitam.svg" alt=""><figcaption>rintisweb-ikon-hitam.svg</figcaption></figure>
    </div>
  </section>

  <section>
    <h2>PNG siap pakai</h2>
    <div class="kecil">
      <figure class="wa"><img src="png/foto-profil-wa.png" alt=""><figcaption>foto-profil-wa.png<br>(terpotong bulat di WA)</figcaption></figure>
      <figure><img src="png/apple-touch-icon.png" alt="" style="width:90px;height:90px;border-radius:20px;border:1px solid #e5e7eb"><figcaption>apple-touch-icon.png</figcaption></figure>
      <figure><img src="png/icon-192.png" alt="" style="width:96px;height:96px;border:1px solid #e5e7eb"><figcaption>icon-192.png</figcaption></figure>
      <figure><img src="png/favicon-48.png" alt="" style="width:48px;height:48px"><figcaption>48 px</figcaption></figure>
      <figure><img src="png/favicon-32.png" alt="" style="width:32px;height:32px"><figcaption>32 px</figcaption></figure>
      <figure><img src="png/favicon-16.png" alt="" style="width:16px;height:16px"><figcaption>16 px</figcaption></figure>
    </div>
    <div class="grid" style="margin-top:14px">
      <figure class="lebar"><img src="png/rintisweb-logo-warna-2000.png" alt=""><figcaption>png/rintisweb-logo-warna-2000.png</figcaption></figure>
      <figure class="lebar gelap"><img src="png/rintisweb-logo-putih-2000.png" alt=""><figcaption>png/rintisweb-logo-putih-2000.png</figcaption></figure>
    </div>
  </section>
</div>
</body>
</html>
