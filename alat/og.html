<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Gambar pratinjau RintisWeb (1200 x 630)</title>
<style>
  @font-face { font-family: "Figtree"; src: url("../assets/fonts/figtree.woff") format("woff"); font-weight: 300 900; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: "Figtree", system-ui, sans-serif; background: radial-gradient(700px 500px at 100% 0%, #1d3fa8 0%, rgba(29,63,168,0) 70%), linear-gradient(135deg, #0b1647, #13235f 70%); color: #fff; position: relative; }
  .teks { position: absolute; left: 72px; top: 70px; width: 600px; }
  .teks img { height: 54px; width: auto; display: block; }
  .label { margin: 46px 0 14px; font-size: 20px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: #7fb2ff; }
  h1 { margin: 0; font-size: 70px; line-height: 1.04; letter-spacing: -.035em; font-weight: 800; }
  h1 span { display: block; background: linear-gradient(90deg, #4d9dff, #00d0ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .layanan { margin-top: 30px; display: flex; gap: 10px; }
  .layanan span { font-size: 21px; font-weight: 700; padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); }
  .hp { position: absolute; width: 230px; border-radius: 26px; border: 7px solid #050a1f; box-shadow: 0 30px 60px rgba(0,0,0,.45); }
  .hp1 { right: 250px; top: 110px; transform: rotate(-7deg); }
  .hp2 { right: 70px; top: 70px; z-index: 2; width: 250px; }
  .hp3 { right: -60px; top: 150px; transform: rotate(8deg); opacity: .95; }
</style>
</head>
<body>
  <div class="teks">
    <img src="../assets/logo/rintisweb-logo-putih.svg" alt="RintisWeb">
    <p class="label">Jasa Pembuatan Website</p>
    <h1>Website Berkualitas, <span>Bisnis Naik Kelas.</span></h1>
    <div class="layanan"><span>Toko Online</span><span>Company Profile</span><span>Landing Page</span></div>
  </div>
  <img class="hp hp1" src="../assets/contoh/kopi-tepas.webp" alt="">
  <img class="hp hp2" src="../assets/contoh/kanaya-wear.webp" alt="">
  <img class="hp hp3" src="../assets/contoh/batik-sekar-jagad.webp" alt="">
</body>
</html>
